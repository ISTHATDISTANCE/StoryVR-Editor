name: Portable runtime

on:
  push:
    branches:
      - codex/native-windows
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out StoryVR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        shell: pwsh
        run: npm.cmd ci

      - name: Check StoryVR sources
        shell: pwsh
        run: npm.cmd run check

      - name: Verify native runtime contracts
        shell: pwsh
        run: npm.cmd run verify:native-runtime

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out StoryVR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: npm ci

      - name: Check StoryVR sources
        run: npm run check

      - name: Verify portable runtime contracts
        run: npm run verify:native-runtime
