name: Portable runtime

on:
  push:
    branches:
      - codex/native-windows
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out StoryVR
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python 3
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        shell: pwsh
        run: npm.cmd ci

      - name: Check StoryVR sources
        shell: pwsh
        run: npm.cmd run check

      - name: Verify native runtime contracts
        shell: pwsh
        run: npm.cmd run verify:native-runtime

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out StoryVR
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python 3
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: npm ci

      - name: Check StoryVR sources
        run: npm run check

      - name: Verify portable runtime contracts
        run: npm run verify:native-runtime
